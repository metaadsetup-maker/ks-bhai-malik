<style>
/* ==========================================================
   K.S BHAI —  trick Landing Page
   Design tokens
   Colors:
     --bg-mint   #EAF6F1  (background gradient start)
     --bg-sky    #E8F0FB  (background gradient end)
     --ink       #10241F  (primary text, deep green-black)
     --ink-soft  #4B6660  (secondary text)
     --accent    #2F6FED  (CTA blue)
     --accent-dk #1E56C9  (CTA blue, pressed)
     --line      #DCE9E3  (hairline candlestick green)
   Type:
     Display: 'Space Grotesk' — used for channel name only
     Body:    'Inter' — everything else
   ========================================================== */

:root{
  --bg-mint: #EAF6F1;
  --bg-sky: #E8F0FB;
  --ink: #10241F;
  --ink-soft: #4B6660;
  --accent: #2F6FED;
  --accent-dk: #1E56C9;
  --card-bg: #FFFFFF;
  --line: #DCE9E3;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
}

body{
  min-height: 100vh;
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg-mint) 0%, var(--bg-sky) 100%);
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* Decorative background pattern */
.bg-decor{
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.chart-pattern{
  width: 140%;
  height: 140%;
  position: absolute;
  top: -10%;
  left: -20%;
  opacity: 0.35;
}

.page{
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(28px + var(--safe-top)) 18px calc(20px + var(--safe-bottom));
}

/* ---------------- Card ---------------- */
.card{
  width: 100%;
  max-width: 420px;
  background: var(--card-bg);
  border-radius: 28px;
  box-shadow: 0 20px 60px -20px rgba(16, 36, 31, 0.25), 0 2px 8px rgba(16, 36, 31, 0.06);
  padding: 36px 26px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  opacity: 0;
  transform: translateY(14px);
  animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes cardIn{
  to{ opacity: 1; transform: translateY(0); }
}

/* ---------------- Profile image ---------------- */
.profile-wrap{
  margin-bottom: 16px;
}

.profile-img{
  width: 130px;
  height: 130px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  box-shadow: 0 8px 24px -6px rgba(47, 111, 237, 0.35), 0 0 0 4px #FFFFFF, 0 0 0 6px var(--line);
  opacity: 0;
  transform: scale(0.9);
  animation: profileIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}

@keyframes profileIn{
  to{ opacity: 1; transform: scale(1); }
}

/* ---------------- Title / subscriber count ---------------- */
.channel-name{
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: clamp(24px, 6vw, 30px);
  margin: 0 0 4px;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.subscribers{
  margin: 0 0 22px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-soft);
  letter-spacing: 0.01em;
}

/* ---------------- Description ---------------- */
.description{
  width: 100%;
  background: linear-gradient(160deg, #F3FBF8 0%, #F0F5FC 100%);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 18px 16px;
  margin-bottom: 18px;
}

.desc-title{
  margin: 0 0 10px;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: 0.03em;
  color: var(--ink);
}

.desc-list{
  list-style: none;
  margin: 0 0 10px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.desc-list li{
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink-soft);
  font-weight: 500;
}

.desc-cta-line{
  margin: 0;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--accent-dk);
}

/* ---------------- Disclaimer ---------------- */
.disclaimer{
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  background: #FBF9F0;
  border: 1px solid #EDE6C8;
  margin-bottom: 24px;
}

.disclaimer-title{
  margin: 0 0 4px;
  font-size: 12.5px;
  font-weight: 700;
  color: #7A6A1E;
  letter-spacing: 0.02em;
}

.disclaimer-body{
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
  color: #8A7A38;
}

/* ---------------- CTA Button ---------------- */
.cta-btn{
  position: relative;
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 17px 20px;
  background: linear-gradient(160deg, var(--accent) 0%, var(--accent-dk) 100%);
  color: #FFFFFF;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 15.5px;
  letter-spacing: 0.03em;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 10px 26px -8px rgba(47, 111, 237, 0.55);
  transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 54px;
}

.cta-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 14px 32px -8px rgba(47, 111, 237, 0.65);
  filter: brightness(1.04);
}

.cta-btn:active{
  transform: translateY(0) scale(0.97);
  box-shadow: 0 6px 16px -6px rgba(47, 111, 237, 0.5);
}

.cta-btn:disabled{
  opacity: 0.75;
  cursor: default;
  transform: none;
}

.cta-btn::after{
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 18px;
  box-shadow: 0 0 0 0 rgba(47, 111, 237, 0.5);
  animation: ctaGlow 2.6s ease-in-out infinite;
  pointer-events: none;
}

@keyframes ctaGlow{
  0%, 100%{ box-shadow: 0 0 0 0 rgba(47, 111, 237, 0.35); }
  50%{ box-shadow: 0 0 0 8px rgba(47, 111, 237, 0); }
}

.cta-label{
  position: relative;
  z-index: 1;
}

.cta-ripple{
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  transform: scale(0);
  pointer-events: none;
  animation: none;
}

.cta-ripple.active{
  animation: rippleOut 0.6s ease-out;
}

@keyframes rippleOut{
  to{
    transform: scale(1);
    opacity: 0;
  }
}

/* ---------------- Invitation text ---------------- */
.invitation{
  margin: 16px 0 0;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-soft);
}

.invitation strong{
  color: var(--ink);
}

/* ---------------- Footer ---------------- */
.footer{
  position: relative;
  z-index: 1;
  margin-top: 22px;
  text-align: center;
  max-width: 420px;
  width: 100%;
  padding-bottom: 6px;
}

.footer-disclaimer{
  margin: 0 0 8px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
}

.footer-links{
  margin: 0 0 8px;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #9BB0AA;
}

.footer-links a{
  color: var(--ink-soft);
  text-decoration: none;
}

.footer-links a:hover{
  text-decoration: underline;
}

.footer-domain{
  margin: 0;
  font-size: 11px;
  color: #A9BDB6;
  letter-spacing: 0.03em;
}

/* ---------------- Reduced motion ---------------- */
@media (prefers-reduced-motion: reduce){
  .card, .profile-img{ animation: none; opacity: 1; transform: none; }
  .cta-btn::after{ animation: none; }
  .cta-btn:hover{ transform: none; }
}

/* ---------------- Small screens ---------------- */
@media (max-width: 360px){
  .card{ padding: 30px 20px 26px; }
  .profile-img{ width: 112px; height: 112px; }
}

/* ---------------- Larger screens ---------------- */
@media (min-width: 640px){
  .page{ padding-top: 60px; padding-bottom: 40px; }
  .card{ padding: 44px 40px 36px; }
}

<script>
/* ==========================================================
   K.S BHAI — TRICK Landing Page
   script.js
   ========================================================== */

/* ------------------------------------------------------------
   1. CONFIGURATION
   Edit the values below to customize the page.
   ------------------------------------------------------------ */
const CONFIG = {
    channelName: "K.S BHAI ❤️",       // 1. Channel name
    subscribers: "40,000 subscribers", // 2. Subscriber count text
    telegramUrl: "https://t.me/+-f5-r35MbUYzYjI1", // 4. Telegram URL (used everywhere)
    metaPixelId: "2120558121866384",   // 5. Meta Pixel ID
    domain: "Ketansingh.site",
    leadValue: 1.00,                   // 6. Lead value (must be a number)
    leadCurrency: "INR"                // 7. Lead currency (code, not symbol)
};

/* ------------------------------------------------------------
   2. APPLY CONFIG TO THE DOM
   (Profile image is set directly in index.html via
   src="profile.jpg" — replace that file to change photo,
   see note at bottom of this file.)
   ------------------------------------------------------------ */
function applyConfig() {
    const nameEls = document.querySelectorAll('#channelName');
    nameEls.forEach(el => { el.textContent = CONFIG.channelName; });

    const subEls = document.querySelectorAll('#subscribers');
    subEls.forEach(el => { el.textContent = CONFIG.subscribers; });

    document.title = `${CONFIG.channelName} | Stock Market Education`;
}

/* ------------------------------------------------------------
   3. META PIXEL INITIALIZATION (fires once)
   ------------------------------------------------------------ */
let pixelInitialized = false;

function initMetaPixel() {
    if (pixelInitialized) return;
    if (typeof fbq !== 'function') return;

    fbq('init', CONFIG.metaPixelId);
    fbq('track', 'PageView');
    pixelInitialized = true;
}

/* ------------------------------------------------------------
   4. VIEWCONTENT (fires once, after page has loaded)
   ------------------------------------------------------------ */
let viewContentFired = false;

function fireViewContent() {
    if (viewContentFired) return;
    if (typeof fbq !== 'function') return;

    fbq('track', 'ViewContent', {
        content_name: CONFIG.channelName,
        content_category: 'Stock Market Education'
    });
    viewContentFired = true;
}

/* ------------------------------------------------------------
   5. UTM CAPTURE — stored in sessionStorage, never rendered
   ------------------------------------------------------------ */
function captureUtmParams() {
    const params = new URLSearchParams(window.location.search);
    const utmKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
    const utmData = {};
    let hasUtm = false;

    utmKeys.forEach(key => {
        const value = params.get(key);
        if (value) {
            utmData[key] = value;
            hasUtm = true;
        }
    });

    if (hasUtm) {
        try {
            sessionStorage.setItem('utm_params', JSON.stringify(utmData));
        } catch (e) {
            // sessionStorage unavailable (private browsing, etc) — fail silently
        }
    }
}

/* ------------------------------------------------------------
   6. LEAD EVENT — fires ONLY on CTA click, exactly once,
      with duplicate-click protection
   ------------------------------------------------------------ */
let leadFired = false;

function handleCtaClick(event) {
    const btn = document.getElementById('ctaBtn');

    // Guard against duplicate/rapid taps
    if (leadFired || (btn && btn.disabled)) {
        return;
    }
    leadFired = true;

    if (btn) {
        btn.disabled = true;
    }

    // Ripple / tap animation
    triggerRipple(event, btn);

    // Fire Lead event before redirect
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', {
            value: CONFIG.leadValue,
            currency: CONFIG.leadCurrency
        });
    }

    // Small delay so the Lead event has a chance to send and the
    // tap animation is visible, then redirect to Telegram.
    setTimeout(() => {
        window.location.href = CONFIG.telegramUrl;
    }, 220);
}

function triggerRipple(event, btn) {
    const ripple = document.getElementById('ctaRipple');
    if (!ripple || !btn) return;

    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.8;
    const clientX = (event && event.clientX) ? event.clientX : rect.left + rect.width / 2;
    const clientY = (event && event.clientY) ? event.clientY : rect.top + rect.height / 2;

    ripple.style.width = `${size}px`;
    ripple.style.height = `${size}px`;
    ripple.style.left = `${clientX - rect.left - size / 2}px`;
    ripple.style.top = `${clientY - rect.top - size / 2}px`;

    ripple.classList.remove('active');
    // force reflow to restart animation
    void ripple.offsetWidth;
    ripple.classList.add('active');
}

/* ------------------------------------------------------------
   7. INIT
   ------------------------------------------------------------ */
document.addEventListener('DOMContentLoaded', () => {
    applyConfig();
    captureUtmParams();
    initMetaPixel();

    const ctaBtn = document.getElementById('ctaBtn');
    if (ctaBtn) {
        ctaBtn.addEventListener('click', handleCtaClick);
    }

    // Fire ViewContent once the landing page has finished loading.
    if (document.readyState === 'complete') {
        fireViewContent();
    } else {
        window.addEventListener('load', fireViewContent, { once: true });
    }
});

   easy to deploy on GitHub Pages). To change it: convert your
   new image to base64 (e.g. base64 -w 0 photo.jpg) and paste
   the result into the src="data:image/jpeg;base64,..." attribute.
   ------------------------------------------------------------ */

</script>
